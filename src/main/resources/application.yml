server:
  port: 8080
  tomcat:
    # 线程模型（NIO）：连接多 ≠ 线程多。1000 个长连接不必对应 1000 个工作线程，
    # 工作线程只处理"就绪"的请求，避免阻塞。
    threads:
      max: 800            # 工作线程数：压测发现 200 在线程排队下 P99 过高，上调以吞吐 1000 并发（I/O 密集，线程可超核数）
      min-spare: 50       # 常驻空闲线程，避免突发请求时频繁建线程
    accept-count: 500     # 工作线程全忙时的等待队列长度，给突发流量缓冲
    max-connections: 10000  # NIO 最大并发连接数（含 keep-alive），给 1000 并发 + 空闲连接留余量
    max-swallow-size: 2MB   # 请求失败/中止时 Tomcat 最多吞掉的请求体，防止大文件占满内存

spring:
  application:
    name: netdisk

  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3307}/${MYSQL_DB:netdisk}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver

  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql

  thymeleaf:
    cache: false

  servlet:
    multipart:
      # 普通上传单文件上限 20MB；超过 20MB 走分片上传（单片 5MB）
      max-file-size: 20MB
      max-request-size: 25MB

mybatis:
  mapper-locations: classpath:mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true

logging:
  level:
    com.netdisk: debug

netdisk:
  # 单用户默认配额（字节）：10GB
  default-quota: 10737418240
  # 文件落盘根目录（相对项目运行目录）
  storage-root: ./data
  jwt:
    # HS256 要求密钥至少 32 字节
    secret: netdisk-dev-jwt-secret-key-please-change-in-production-0123456789
    expire-minutes: 120
