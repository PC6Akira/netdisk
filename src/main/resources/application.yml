server:
  port: 8080

spring:
  application:
    name: netdisk

  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3307}/${MYSQL_DB:netdisk}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver

  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql

  thymeleaf:
    cache: false

  servlet:
    multipart:
      # 普通上传单文件上限 20MB；超过 20MB 走分片上传（单片 5MB）
      max-file-size: 20MB
      max-request-size: 25MB

mybatis:
  mapper-locations: classpath:mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true

logging:
  level:
    com.netdisk: debug

netdisk:
  # 单用户默认配额（字节）：10GB
  default-quota: 10737418240
  # 文件落盘根目录（相对项目运行目录）
  storage-root: ./data
  jwt:
    # HS256 要求密钥至少 32 字节
    secret: netdisk-dev-jwt-secret-key-please-change-in-production-0123456789
    expire-minutes: 120
