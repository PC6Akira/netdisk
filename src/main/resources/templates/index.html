<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的网盘</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<header class="navbar">
    <div class="brand">网盘</div>
    <div class="user-info">
        <span id="username">…</span>
        <div class="quota-text" id="quota-text">已用 - / -</div>
        <div class="quota-bar"><div class="used" id="quota-used"></div></div>
        <a href="#" id="logout">退出</a>
    </div>
</header>

<main class="container">
    <div class="toolbar">
        <button>上传文件</button>
        <button>新建文件夹</button>
    </div>

    <!-- 阶段 2 接后端：替换为真实文件列表 -->
    <table class="file-table">
        <thead>
        <tr><th>名称</th><th>大小</th><th>修改时间</th><th>操作</th></tr>
        </thead>
        <tbody>
        <tr><td>📁 我的文档</td><td>-</td><td>2026-09-15 10:00</td><td><a href="#">重命名</a><a href="#">删除</a></td></tr>
        <tr><td>📄 示例图片.jpg</td><td>1.2 MB</td><td>2026-09-15 09:30</td><td><a href="#">预览</a><a href="#">下载</a><a href="#">删除</a></td></tr>
        <tr><td>🎬 示例视频.mp4</td><td>256 MB</td><td>2026-09-14 18:20</td><td><a href="#">预览</a><a href="#">下载</a><a href="#">删除</a></td></tr>
        </tbody>
    </table>
</main>
<script th:src="@{/js/app.js}"></script>
<script>
    // 未登录跳转到登录页
    if (!API.getToken()) {
        window.location.href = '/login';
    }

    document.getElementById('logout').addEventListener('click', (e) => {
        e.preventDefault();
        API.clearToken();
        window.location.href = '/login';
    });

    (async () => {
        try {
            const user = await API.get('/api/user/me');
            document.getElementById('username').textContent = user.nickname || user.username;
            document.getElementById('quota-text').textContent =
                '已用 ' + formatBytes(user.quotaUsed) + ' / ' + formatBytes(user.quotaLimit);
            const pct = user.quotaLimit > 0 ? (user.quotaUsed / user.quotaLimit * 100) : 0;
            document.getElementById('quota-used').style.width = Math.min(pct, 100) + '%';
        } catch (err) {
            console.error(err);
        }
    })();
</script>
</body>
</html>
